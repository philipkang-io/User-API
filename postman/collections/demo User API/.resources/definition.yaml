$kind: collection
description: |-
  A simple user management API for registering, authenticating, and managing user accounts.

  Contact Support:
   Name: Cotality API Platform Team
   Email: api-support@example.com
variables:
  baseUrl: https://customer-education.postmanlabs.com
auth:
  - id: d416e723-2752-4683-b0cf-1e3d210926df
    type: apikey
    name: apikey auth
    credentials:
      key: X-API-Key
      value: "{{apiKey}}"
      in: header
