$kind: http-request
name: register User
description: Creates a new user account and returns the user with an authentication token.
url: "{{baseUrl}}/v1/users/register"
method: POST
headers:
  Content-Type: application/json
  Accept: application/json
body:
  type: json
  content: |-
    {
      "username": "{{$randomUserName}}",
      "password": "{{$randomPassword}}"
    }
  $type: |-
    {
      "description": "The username and password used to register or authenticate a user.",
      "type": "object",
      "properties": {
        "username": {
          "type": "string",
          "description": "The user's username."
        },
        "password": {
          "type": "string",
          "description": "The user's password."
        }
      }
    }
examples: ./.resources/register User.resources/examples
order: 1000
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 201", function () {
        pm.response.to.have.status(201);
      });
    language: text/javascript
