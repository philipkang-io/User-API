$kind: http-request
description: Permanently deletes a user account.
url: "{{baseUrl}}/v1/users/:id"
method: DELETE
headers:
  Accept: application/json
pathVariables:
  - key: id
    value: "7432"
    description: The unique identifier of the user.
    $type: |-
      {
        "type": "object",
        "properties": {
          "value": {
            "type": "integer"
          }
        },
        "required": [
          "value"
        ]
      }
body:
  type: text
  content: ""
examples: ./.resources/delete User.resources/examples
order: 3000
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status code is 200", function () {
        pm.response.to.have.status(200);
      });
