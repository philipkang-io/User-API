openapi: 3.0.0
info:
  title: User API
  version: 1.0.0
  description: A simple user management API for registering, authenticating, and managing user accounts.
  contact:
    name: Cotality API Platform Team
    url: https://example.com/support
    email: api-support@example.com
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0.html
servers:
  - url: https://customer-education.postmanlabs.com
    description: Staging environment
tags:
  - name: Users
    description: Operations for managing user accounts.
paths:
  /v1/users/register:
    post:
      description: Creates a new user account and returns the user with an authentication token.
      operationId: registerUser
      tags:
        - Users
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserCredentials'
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserWithToken'
        '500':
          description: Error occurred
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
  /v1/users/login:
    post:
      description: Authenticates a user and returns the user with an authentication token.
      operationId: loginUser
      tags:
        - Users
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserCredentials'
      responses:
        '200':
          description: User logged in successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserWithToken'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
        '500':
          description: Error occurred
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
  /v1/users/{id}:
    get:
      description: Returns a single user by their unique identifier.
      operationId: getUserById
      tags:
        - Users
      parameters:
        - in: path
          name: id
          required: false
          description: The unique identifier of the user.
          schema:
            type: integer
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '404':
          description: User not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
        '500':
          description: Error occurred
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
    put:
      description: Updates an existing user's credentials.
      operationId: updateUser
      tags:
        - Users
      parameters:
        - in: path
          name: id
          required: true
          description: The unique identifier of the user.
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserCredentials'
      responses:
        '200':
          description: User updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessMessage'
        '500':
          description: Error occurred
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
    delete:
      description: Permanently deletes a user account.
      operationId: deleteUser
      tags:
        - Users
      parameters:
        - in: path
          name: id
          required: true
          description: The unique identifier of the user.
          schema:
            type: integer
      responses:
        '200':
          description: User deleted successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessMessage'
        '500':
          description: Error occurred
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
      description: API key required in the X-API-Key header.
  schemas:
    UserId:
      type: integer
      description: The unique identifier of a user.
    UserCredentials:
      type: object
      description: The username and password used to register or authenticate a user.
      properties:
        username:
          type: string
          description: The user's username.
        password:
          type: string
          description: The user's password.
    User:
      type: object
      description: A user account.
      properties:
        id:
          type: integerr
          description: The unique identifier of the user.
        username:
          type: string
          description: The user's username.
        roles:
          type: array
    UserWithToken:
      description: A user account together with an authentication token.
      allOf:
        - $ref: '#/components/schemas/User'
        - type: object
          properties:
            token:
              type: string
              description: The authentication token issued to the user.
    ErrorMessage:
      type: object
      description: A standard error response.
      properties:
        message:
          type: string
          description: A human-readable error message.
    SuccessMessage:
      type: object
      description: A standard success response.
      properties:
        message:
          type: string
          description: A human-readable success message.
security:
  - ApiKeyAuth: []
