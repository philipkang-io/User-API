openapi: 3.0.0
info:
  title: User API
  version: 1.0.0
  description: A simple user management API for registering, authenticating, and managing user accounts.
  contact:
    name: Cotality API Platform Team
    url: https://example.com/support
    email: api-support@example.com
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0.html
servers:
  - url: https://customer-education.postmanlabs.com
    description: Staging environment
tags:
  - name: Users
    description: Operations for managing user accounts.
paths:
  /v1/users/register:
    post:
      summary: Register a new user
      description: Creates a new user account and returns the user with an authentication token.
      operationId: registerUser
      tags:
        - Users
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserCredentials'
      responses:
        '201':
          description: User registered successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserWithToken'
        '400':
          description: Invalid input - missing or invalid username/password
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
        '409':
          description: User already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
      security:
        - ApiKeyAuth: []
  /v1/users/login:
    post:
      summary: Authenticate a user
      description: Authenticates a user and returns the user with an authentication token.
      operationId: loginUser
      tags:
        - Users
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserCredentials'
      responses:
        '200':
          description: User logged in successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserWithToken'
        '400':
          description: Invalid input - missing or invalid username/password
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
        '401':
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
      security:
        - ApiKeyAuth: []
  /v1/users/{id}:
    get:
      summary: Get user by ID
      description: Returns a single user by their unique identifier.
      operationId: getUserById
      tags:
        - Users
      parameters:
        - in: path
          name: id
          required: true
          description: The unique identifier of the user.
          schema:
            $ref: '#/components/schemas/UserId'
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          description: Unauthorized - API key required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
        '403':
          description: Forbidden - insufficient permissions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
        '404':
          description: User not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
      security:
        - ApiKeyAuth: []
    put:
      summary: Update user credentials
      description: Updates an existing user's credentials.
      operationId: updateUser
      tags:
        - Users
      parameters:
        - in: path
          name: id
          required: true
          description: The unique identifier of the user.
          schema:
            $ref: '#/components/schemas/UserId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserCredentials'
      responses:
        '200':
          description: User updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessMessage'
        '400':
          description: Invalid input - missing or invalid username/password
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
        '401':
          description: Unauthorized - API key required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
        '403':
          description: Forbidden - insufficient permissions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
        '404':
          description: User not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
      security:
        - ApiKeyAuth: []
    delete:
      summary: Delete a user account
      description: Permanently deletes a user account.
      operationId: deleteUser
      tags:
        - Users
      parameters:
        - in: path
          name: id
          required: true
          description: The unique identifier of the user.
          schema:
            $ref: '#/components/schemas/UserId'
      responses:
        '200':
          description: User deleted successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessMessage'
        '401':
          description: Unauthorized - API key required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
        '403':
          description: Forbidden - insufficient permissions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
        '404':
          description: User not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
      security:
        - ApiKeyAuth: []
components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
      description: API key required in the X-API-Key header for authentication and authorization.
  schemas:
    UserId:
      type: integer
      description: The unique identifier of a user.
      example: 12345
    UserCredentials:
      type: object
      description: The username and password used to register or authenticate a user.
      required:
        - username
        - password
      properties:
        username:
          type: string
          description: The user's username (must be unique).
          minLength: 3
          maxLength: 50
          example: john_doe
        password:
          type: string
          description: The user's password (minimum 8 characters).
          minLength: 8
          maxLength: 128
          example: SecurePassword123
    User:
      type: object
      description: A user account.
      required:
        - id
        - username
      properties:
        id:
          type: integer
          description: The unique identifier of the user.
          example: 12345
        username:
          type: string
          description: The user's username.
          example: john_doe
        roles:
          type: array
          description: List of roles assigned to the user.
          items:
            type: string
            example: user
          example:
            - user
            - admin
    UserWithToken:
      description: A user account together with an authentication token.
      required:
        - id
        - username
        - token
      allOf:
        - $ref: '#/components/schemas/User'
        - type: object
          properties:
            token:
              type: string
              description: The authentication token issued to the user (JWT format).
              example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
    ErrorMessage:
      type: object
      description: A standard error response.
      required:
        - message
      properties:
        message:
          type: string
          description: A human-readable error message.
          example: Invalid credentials provided
    SuccessMessage:
      type: object
      description: A standard success response.
      required:
        - message
      properties:
        message:
          type: string
          description: A human-readable success message.
          example: User updated successfully
security:
  - ApiKeyAuth: []
